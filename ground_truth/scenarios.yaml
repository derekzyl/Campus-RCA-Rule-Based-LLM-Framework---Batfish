# Ground-truth labels for dissertation evaluation (Chapter 3/5)
# Each scenario has a known injected root cause for objective scoring.

scenarios:
  - id: acl_deny_http
    name: "ACL denies student HTTP to faculty portal"
    snapshot_dir: configs/scenarios/acl_deny_http
    symptom: "Students in 10.10.10.0/24 cannot browse http://10.20.20.50 (faculty portal). HTTPS may still work."
    probe:
      src_ip: "10.10.10.10"
      dst_ip: "10.20.20.50"
      dst_port: 80
      ip_protocol: "TCP"
      applications: ["HTTP"]
    ground_truth:
      fault_type: acl_deny
      device: dist2
      object: CAMPUS_EDGE
      layer: policy
      keywords: ["ACL", "CAMPUS_EDGE", "deny", "HTTP", "80", "dist2"]

  - id: missing_ospf_network
    name: "Student VLAN not advertised in OSPF"
    snapshot_dir: configs/scenarios/missing_ospf_network
    symptom: "Faculty host 10.20.20.100 cannot reach student subnet 10.10.10.0/24. Local gateway on dist1 works."
    probe:
      src_ip: "10.20.20.100"
      dst_ip: "10.10.10.10"
      dst_port: null
      ip_protocol: "ICMP"
      applications: []
    ground_truth:
      fault_type: missing_route
      device: dist1
      object: "10.10.10.0/24"
      layer: routing
      keywords: ["OSPF", "missing", "10.10.10.0", "dist1", "network statement"]

  - id: interface_shutdown
    name: "Core uplink to dist2 shut down"
    snapshot_dir: configs/scenarios/interface_shutdown
    symptom: "Entire faculty VLAN 10.20.20.0/24 is unreachable from student network and core."
    probe:
      src_ip: "10.10.10.10"
      dst_ip: "10.20.20.50"
      dst_port: 443
      ip_protocol: "TCP"
      applications: ["HTTPS"]
    ground_truth:
      fault_type: interface_down
      device: core1
      object: GigabitEthernet0/1
      layer: interface
      keywords: ["shutdown", "GigabitEthernet0/1", "core1", "interface", "dist2"]

  - id: wrong_static_route
    name: "Incorrect default route next-hop on core"
    snapshot_dir: configs/scenarios/wrong_static_route
    symptom: "Campus hosts cannot reach the Internet (203.0.113.0/24). Internal campus reachability is OK."
    probe:
      src_ip: "10.10.10.10"
      dst_ip: "203.0.113.50"
      dst_port: null
      ip_protocol: "ICMP"
      applications: []
    ground_truth:
      fault_type: wrong_static_route
      device: core1
      object: "0.0.0.0/0"
      layer: routing
      keywords: ["static", "default", "next-hop", "10.10.10.1", "core1"]

  - id: ospf_passive_misconfig
    name: "Faculty VLAN omitted from OSPF advertisement"
    snapshot_dir: configs/scenarios/ospf_passive_misconfig
    symptom: "Student hosts cannot reach faculty servers in 10.20.20.0/24. dist2 local interfaces look up."
    probe:
      src_ip: "10.10.10.10"
      dst_ip: "10.20.20.50"
      dst_port: 80
      ip_protocol: "TCP"
      applications: ["HTTP"]
    ground_truth:
      fault_type: missing_route
      device: dist2
      object: "10.20.20.0/24"
      layer: routing
      keywords: ["OSPF", "10.20.20.0", "dist2", "missing", "passive"]

baseline:
  snapshot_dir: configs/baseline
  description: "Known-good campus OSPF + ACL posture for differential analysis"
