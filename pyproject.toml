[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campus-rca"
version = "0.1.0"
description = "Rule-based LLM framework for campus network RCA using Batfish"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pybatfish>=0.40.0",
  "pandas>=2.0.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "openai>=1.12.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "jinja2>=3.1.3",
  "matplotlib>=3.8.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]

[project.scripts]
campus-rca = "campus_rca.cli:app"
campus-rca-gui = "campus_rca.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_rca"]

[tool.uv]
package = true
