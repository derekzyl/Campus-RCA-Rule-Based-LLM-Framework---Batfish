services:
  batfish:
    image: batfish/allinone:latest
    container_name: campus-rca-batfish
    ports:
      - "8888:8888"   # Jupyter (optional)
      - "9997:9997"   # Batfish service
      - "9996:9996"   # Batfish coordinator
    volumes:
      - batfish-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9996/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  batfish-data: