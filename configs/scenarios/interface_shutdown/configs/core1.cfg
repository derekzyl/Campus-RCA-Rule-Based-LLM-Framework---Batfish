!
! FAULT: Core uplink to dist2 administratively shut down
! Ground truth: interface_shutdown on core1 GigabitEthernet0/1
!
hostname core1
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description to-dist1
 ip address 10.1.12.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description to-dist2
 ip address 10.1.13.1 255.255.255.252
 shutdown
!
interface GigabitEthernet0/2
 description to-border
 ip address 10.1.14.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 10.1.12.0 0.0.0.3 area 0
 network 10.1.13.0 0.0.0.3 area 0
 network 10.1.14.0 0.0.0.3 area 0
 network 1.1.1.1 0.0.0.0 area 0
!
ip route 0.0.0.0 0.0.0.0 10.1.14.2
!
end
