!
! FAULT: Faculty VLAN marked passive — should still advertise, but we
! remove network statement AND make adjacent core link appear one-sided.
! Stronger fault: OSPF network for faculty VLAN omitted (same symptom class).
!
hostname dist2
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface GigabitEthernet0/0
 description to-core1
 ip address 10.1.13.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description faculty-vlan20
 ip address 10.20.20.1 255.255.255.0
 ip access-group CAMPUS_EDGE in
 no shutdown
!
ip access-list extended CAMPUS_EDGE
 permit tcp 10.10.10.0 0.0.0.255 host 10.20.20.50 eq 80
 permit tcp 10.10.10.0 0.0.0.255 host 10.20.20.50 eq 443
 permit icmp any any
 deny ip 10.10.10.0 0.0.0.255 10.20.20.0 0.0.0.255
 permit ip any any
!
router ospf 1
 router-id 3.3.3.3
 network 10.1.13.0 0.0.0.3 area 0
 network 3.3.3.3 0.0.0.0 area 0
 passive-interface GigabitEthernet0/1
 remark FAULT: faculty VLAN 10.20.20.0 not in OSPF
!
end
